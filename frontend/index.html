<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DB Indexing Advisor</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
  h2 { text-align: center; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #2c7be5; color: white; border: none; border-radius: 5px; cursor: pointer; }
  #result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
</style>
</head>
<body>

<h2>DB Indexing Advisor</h2>

<label>Is Join Column?</label>
<select id="is_join_column">
  <option value="1">Yes</option>
  <option value="0">No</option>
</select>

<label>Selectivity Ratio (0 to 1)</label>
<input type="number" id="selectivity_ratio" step="0.01" min="0" max="1" value="0.3">

<label>Table Row Count</label>
<input type="number" id="table_row_count" value="10000">

<label>Scan Type Frequency (1 = full scan, 0 = index used)</label>
<select id="scan_type_frequency">
  <option value="1">1 (Full Scan)</option>
  <option value="0">0 (Index Used)</option>
</select>

<button onclick="getPrediction()">Check Indexing Recommendation</button>

<div id="result"></div>

<script>
async function getPrediction() {
  const data = {
    is_join_column: parseInt(document.getElementById('is_join_column').value),
    selectivity_ratio: parseFloat(document.getElementById('selectivity_ratio').value),
    table_row_count: parseInt(document.getElementById('table_row_count').value),
    scan_type_frequency: parseInt(document.getElementById('scan_type_frequency').value)
  };

  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.style.background = '#eee';
  resultDiv.innerText = 'Checking...';

  try {
    const response = await fetch('http://127.0.0.1:5000/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await response.json();

    if (result.index_recommended === 1) {
      resultDiv.style.background = '#d4edda';
      resultDiv.innerText = '✅ Index Recommended';
    } else {
      resultDiv.style.background = '#f8d7da';
      resultDiv.innerText = '❌ Index Not Needed';
    }
  } catch (err) {
    resultDiv.style.background = '#f8d7da';
    resultDiv.innerText = 'Error: Backend not reachable. Is Flask running?';
  }
}
</script>

</body>
</html>
